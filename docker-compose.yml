services:
  bot:
    build: .
    image: solo-manga-bot
    # Runs Docker's built-in tini as PID 1 instead of xvfb-run itself.
    # xvfb-run waits on a shell signal to know Xvfb is ready to accept
    # connections - that signal never arrives when the shell is PID 1
    # (no real init, signal delivery to PID 1 is unreliable), so without
    # this xvfb-run hangs forever before ever launching node.
    init: true
    # Docker's default /dev/shm is 64MB, which the real (non-headless) Chrome
    # this bot drives (see getBrowser() in server/bot.js) can exhaust under
    # normal page rendering - seen in production as frequent "navigation
    # didn't settle" warnings. 1GB matches what Google's own Puppeteer-in-
    # Docker guidance recommends; --disable-dev-shm-usage in bot.js's Chrome
    # args is a second layer of the same fix for hosts that ignore this.
    shm_size: '1gb'
    env_file:
      - .env
    volumes:
      - ./server/data:/app/server/data
    # No restart policy on purpose - this is a one-shot CLI (discover+scrape,
    # then exit), not a daemon. Run it on demand or from host cron:
    #   docker compose run --rm bot                  # sync everything
    #   docker compose run --rm bot add <seriesUrl>   # add + scrape one series
    #   docker compose run --rm bot crawl <siteUrl>   # whole-site crawl
